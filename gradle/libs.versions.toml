[versions]
agp = "9.1.0"
activityCompose = "1.10.1"
composeBom = "2024.09.00"
coreKtx = "1.13.1"
junit = "4.13.2"
kotlin = "2.2.20"
ksp = "2.2.20-2.0.2"
lifecycle = "2.8.7"
media3 = "1.8.0"
okhttp = "4.12.0"
palette = "1.0.0"
room = "2.7.1"
